name: Regenerate portrait

on:
  schedule:
    - cron: "17 4 * * *"   # once a day
  workflow_dispatch: {}
  push:
    paths:
      - "assets/photo.png"
      - "generate_portrait.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Regenerate portrait.svg
        run: |
          python3 generate_portrait.py assets/photo.png portrait.svg --seed "$(date +%j)" --cols 92

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- portrait.svg; then
            git add portrait.svg
            git commit -m "chore: regenerate portrait ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no changes"
          fi
